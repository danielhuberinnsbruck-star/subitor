<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check-out Board</title>
<style>
  :root{--bg:#f0f4f8;--panel:#fff5f7;--panel-2:#ffeef2;--line:#d6e1ed;
         --ink:#1a1a1a;--ink-2:#666666;--ink-3:#999999;
         --hot:#ff5c47;--hot-soft:rgba(255,92,71,.14);
         --calm:#37d39b;--calm-soft:rgba(55,211,155,.13);--r:14px}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
       font:400 16px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
       -webkit-font-smoothing:antialiased;padding:0 0 80px}
  .wrap{max-width:1400px;margin:0 auto;padding:0 24px}
  header{background:linear-gradient(#d6e1ed 72%,rgba(214,225,237,.85));
          backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:22px 0 0}
  .head-row{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;justify-content:space-between}
  h1{margin:0;font-size:clamp(12px,1.5vw,17px);font-weight:650;letter-spacing:-.02em}
  h1 span{color:var(--ink-3);font-weight:400}
  .clock{font-variant-numeric:tabular-nums;font-size:8px;color:var(--ink-2);text-align:right}
  .clock b{display:block;font-size:14px;color:var(--ink);font-weight:600}
  .kpis{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 9px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;
       padding:6px 9px;min-width:66px}
  .kpi b{display:block;font-size:16px;line-height:1.1;font-weight:650}
  .kpi span{font-size:6px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.07em}
  .kpi.hot b{color:var(--hot)}.kpi.calm b{color:var(--calm)}
  .days{display:flex;gap:6px;overflow-x:auto;padding:0 0 16px}
  .day{flex:0 0 auto;background:#c5d3e8;border:1px solid #b0c1dd;color:var(--ink);
       border-radius:8px;padding:6px 10px;cursor:pointer;text-align:center;transition:.14s;
       min-width:56px;font:inherit}
  .day:hover{border-color:#9ab0d0;background:#d4dfe9}
  .day .dw{font-size:8px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
  .day .dd{font-size:13px;font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums}
  .day .dc{font-size:8px;color:var(--ink-2);margin-top:1px}
  .day[aria-selected="true"]{background:#2c5aa0;border-color:#2c5aa0;color:#ffffff}
  .day[aria-selected="true"] .dw,.day[aria-selected="true"] .dc{color:#ffffff}
  h2{margin:30px 0 4px;font-size:20px;font-weight:620;display:flex;align-items:baseline;gap:12px}
  h2 em{font-style:normal;font-size:13.5px;color:var(--ink-3);font-weight:400}
  .grp{margin-top:26px}
  .grp-h{display:flex;align-items:center;gap:10px;margin:0 0 12px;
          font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);font-weight:700}
  .grp-h:after{content:"";flex:1;height:1px;background:var(--line)}
  .grid{display:grid;gap:12px;grid-template-columns:auto}
  .card{background:var(--panel);border:none;border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;font-size:13px;white-space:nowrap}
  .card.turn{opacity:.95}
  .c-top{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
  .room{font-size:13px;font-weight:600;line-height:1.2}
  .sub{font-size:10px;color:var(--ink-3);margin-top:2px;display:none}
  .out{text-align:right;flex:0 0 auto}
  .out b{display:block;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
  .out span{font-size:9px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;display:none}
  .guest{display:flex;align-items:center;gap:4px;font-size:11px}
  .guest .av{width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.2);
             display:grid;place-items:center;font-size:9px;font-weight:600;color:var(--ink);flex:0 0 auto}
  .guest small{color:var(--ink-3);font-size:9px;display:none}
  .badge{display:none}
  .card.turn .badge{background:var(--hot-soft);color:#ffb3a6}
  .badge b{font-weight:620}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto;margin-top:7px}
  .empty{border:1px dashed var(--line);border-radius:var(--r);padding:44px;text-align:center;color:var(--ink-3)}
  footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="head-row">
      <h1>Check-out Board <span>&middot; Innsbruck</span></h1>
      <div class="clock"><b id="clock">--:--</b><span id="today-label"></span></div>
    </div>
    <div class="kpis">
      <div class="kpi"><b id="k-out">0</b><span>Zimmer checken aus</span></div>
      <div class="kpi hot"><b id="k-turn">0</b><span>Sofort-Wechsel</span></div>
      <div class="kpi calm"><b id="k-free">0</b><span>Bleiben frei</span></div>
      <div class="kpi"><b id="k-gst">0</b><span>Gäste reisen ab</span></div>
    </div>
    <div class="days" id="days" role="tablist"></div>
  </div>
</header>

<main class="wrap">
  <h2 id="sec-title">Heute</h2>
  <div id="board"></div>
  <footer>
    Daten: Hospitable-Kalender &middot; Stand <span id="gen"></span> &middot; <span id="pcount"></span> Objekte im Portfolio.
    <br>Farbcode: Grün = Pradler Str. | Orange/Rot/Gelb = Kaiser-Franz-Josef-Str. | Blau = Villen
  </footer>
</main>

<script>
var DATA = JSON.parse(document.getElementById('payload').textContent);
var WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
var MO = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
var BUILD_LABEL = {'P23':'Pradler Straße 23','Kfj13':'Kaiser-Franz-Josef-Straße 13','Villa':'Villen','Sonstige':'Weitere Objekte'};
var byDate = {};
DATA.events.forEach(function(e){ (byDate[e.date] = byDate[e.date] || []).push(e); });
function d(iso){ var p = iso.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function fmt(iso){ var x = d(iso); return WD[x.getDay()] + ', ' + x.getDate() + '. ' + MO[x.getMonth()]; }
function pad(n){ return String(n).padStart(2,'0'); }
function initials(n){ return n.split(/\s+/).slice(0,2).map(function(w){ return w[0] || ''; }).join('').toUpperCase(); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function nights(n){ return n + (n === 1 ? ' Nacht' : ' Nächte'); }
function guests(n){ return n ? n + (n === 1 ? ' Gast' : ' Gäste') : '? Gäste'; }
function cleanRoomName(name){ return (name || '').replace(/^\d+\.\s*/, '').replace(/\s*-\s*(top\d+|top\s*\d+)$/i, ''); }
var selected = DATA.today;
function renderDays(){
  var host = document.getElementById('days');
  host.innerHTML = '';
  Object.keys(byDate).sort().forEach(function(iso){
    var n = byDate[iso].length, x = d(iso);
    var el = document.createElement('button');
    el.className = 'day';
    el.setAttribute('role','tab');
    el.setAttribute('aria-selected', iso === selected);
    el.innerHTML = '<div class="dw">' + WD[x.getDay()] + (iso === DATA.today ? ' &middot; heute' : '') + '</div>' +
                   '<div class="dd">' + pad(x.getDate()) + '.' + pad(x.getMonth()+1) + '</div>' +
                   '<div class="dc">' + n + '</div>';
    el.onclick = function(){ selected = iso; renderDays(); renderBoard(); };
    host.appendChild(el);
  });
}
function renderBoard(){
  var list = (byDate[selected] || []).slice();
  var turn = list.filter(function(e){ return e.turnover; }).length;
  document.getElementById('k-out').textContent  = list.length;
  document.getElementById('k-turn').textContent = turn;
  document.getElementById('k-free').textContent = list.length - turn;
  document.getElementById('k-gst').textContent  = list.reduce(function(s,e){ return s + (e.guests || 0); }, 0);
  document.getElementById('sec-title').innerHTML = (selected === DATA.today)
    ? 'Heute <em>' + fmt(selected) + '</em>'
    : fmt(selected) + ' <em>' + (list.length ? list.length + ' Check-outs' : 'keine Check-outs') + '</em>';
  var board = document.getElementById('board');
  board.innerHTML = '';
  if(!list.length){
    board.innerHTML = '<div class="empty">Keine Check-outs an diesem Tag.</div>';
    return;
  }
  var order = ['P23','Kfj13','Villa','Sonstige'];
  var groups = {};
  list.forEach(function(e){ (groups[e.building] = groups[e.building] || []).push(e); });
  order.filter(function(b){ return groups[b]; }).forEach(function(b){
    var sec = document.createElement('section');
    sec.className = 'grp';
    sec.innerHTML = '<div class="grp-h">' + (BUILD_LABEL[b] || b) + ' &middot; ' + groups[b].length + '</div>';
    var grid = document.createElement('div');
    grid.className = 'grid';
    groups[b].sort(function(a,c){ return (a.room||'').localeCompare(c.room||'', 'de', {numeric:true}); })
      .forEach(function(e){
        var card = document.createElement('article');
        card.className = 'card' + (e.turnover ? ' turn' : '');
        if(e.color){card.style.backgroundColor = e.color; card.style.color = '#fff';}
        var badge;
        if(e.turnover){
          badge = '<div class="badge"><span class="dot"></span><div><b>Wechsel am selben Tag</b> — ' +
                  esc(e.turnover.guest) + ' checkt ' +
                  (e.turnover.time ? 'ab ' + e.turnover.time + ' Uhr' : 'heute') + ' ein' +
                  (e.turnover.guests ? ' · ' + guests(e.turnover.guests) : '') + '</div></div>';
        } else {
          var nxt = (e.next_arrival && e.next_arrival.date > e.date)
            ? ' — nächster Check-in ' + fmt(e.next_arrival.date)
            : ' — kein Folge-Check-in gebucht';
          badge = '<div class="badge"><span class="dot"></span><div><b>Bleibt frei</b>' + nxt + '</div></div>';
        }
        card.innerHTML =
          '<div class="c-top">' +
            '<div><div class="room">' + esc(cleanRoomName(e.room)) + '</div>' +
            '<div class="sub">' + esc(e.public_name) + '</div></div>' +
          '</div>' + badge;
        grid.appendChild(card);
      });
    sec.appendChild(grid);
    board.appendChild(sec);
  });
}
function alignCardWidths(){
  var allCards = document.querySelectorAll('.card');
  var maxWidth = 0;
  allCards.forEach(function(card){ maxWidth = Math.max(maxWidth, card.scrollWidth); });
  allCards.forEach(function(card){ card.style.width = maxWidth + 'px'; });
}
function tick(){
  var n = new Date();
  document.getElementById('clock').textContent = pad(n.getHours()) + ':' + pad(n.getMinutes());
  document.getElementById('today-label').textContent = fmt(DATA.today);
}
document.getElementById('gen').textContent = (DATA.generated_at || '').replace('T',' ').replace('Z',' UTC');
document.getElementById('pcount').textContent = DATA.properties_total;
renderDays(); renderBoard(); setTimeout(alignCardWidths, 50); tick(); setInterval(tick, 20000);
</script>
